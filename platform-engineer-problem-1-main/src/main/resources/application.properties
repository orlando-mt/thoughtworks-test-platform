spring.config.import=optional:file:.env[.properties]
server.port=8080

# PostgreSQL / Aurora: host, puerto, base y usuario tienen valores por defecto
# para desarrollo local; la contraseña y el secreto JWT siempre vienen del entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Tolerar el arranque en frío de Aurora (~15 s) y no retener conexiones,
# para que Aurora pueda pausarse
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Health check del ALB: solo expone /actuator/health y no consulta la base
management.endpoints.web.exposure.include=health
management.health.db.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.ttl-minutes=${JWT_TTL_MINUTES:60}

# Swagger apagado por defecto; se enciende solo donde SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Errores de validación (@Valid) también en formato ProblemDetail
spring.mvc.problemdetails.enabled=true

# Plataforma
platform.environments=dev,qa,prod
platform.self-service-environments=dev,qa
platform.name-pattern=^[a-z0-9][a-z0-9-]{1,20}[a-z0-9]$
platform.catalog-ttl=5m

# GitHub App
platform.github.api-url=https://api.github.com
platform.github.org=${GITHUB_ORG:kordanix-io}
platform.github.app-id=${GITHUB_APP_ID}
platform.github.installation-id=${GITHUB_APP_INSTALLATION_ID}

# Ruta al .pem (local) o contenido del .pem (ECS, desde Secrets Manager)
platform.github.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}
platform.github.private-key=${GITHUB_APP_PRIVATE_KEY:}
platform.github.catalog-repo=platform-catalog
platform.github.catalog-ref=main

# --- Terraform que genera la plataforma ---
platform.terraform.region=${AWS_REGION:us-east-1}
platform.terraform.state-bucket=${TF_STATE_BUCKET:kordanix-platform-tfstate}
platform.terraform.aws-provider-version=>= 5.0

# --- Bedrock ---
platform.bedrock.region=${AWS_REGION:us-east-1}
platform.bedrock.model-id=${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
platform.bedrock.profile=${AWS_PROFILE:}
platform.bedrock.max-tokens=8000
platform.bedrock.timeout=90s
platform.bedrock.max-attempts=3

# --- Quién escribe el Terraform: bedrock | anthropic ---
platform.scaffolder.provider=${SCAFFOLDER_PROVIDER:bedrock}

# --- API de Anthropic (alternativa a Bedrock, mismo modelo) ---
platform.anthropic.api-url=https://api.anthropic.com
platform.anthropic.api-key=${ANTHROPIC_API_KEY:}
platform.anthropic.model-id=${ANTHROPIC_MODEL_ID:claude-haiku-4-5-20251001}
platform.anthropic.max-tokens=8000
platform.anthropic.timeout=90s